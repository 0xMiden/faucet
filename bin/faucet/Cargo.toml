[package]
authors.workspace      = true
description            = "Token faucet application for Miden testnet"
edition.workspace      = true
homepage.workspace     = true
keywords               = ["faucet", "miden", "node"]
license.workspace      = true
name                   = "miden-faucet"
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
miden-faucet-lib       = { workspace = true }
miden-pow-rate-limiter = { features = ["tokio"], workspace = true }

# Miden dependencies.
miden-protocol = { workspace = true }

# External dependencies.
anyhow                = { workspace = true }
async-trait           = { version = "0.1" }
axum                  = { features = ["tokio"], version = "0.8" }
axum-extra            = { version = "0.12" }
base64                = { version = "0.22" }
clap                  = { features = ["derive", "env", "string"], version = "4.5" }
hex                   = { workspace = true }
http                  = { workspace = true }
humantime             = { workspace = true }
opentelemetry         = { workspace = true }
opentelemetry-otlp    = { workspace = true }
opentelemetry_sdk     = { workspace = true }
rand                  = { features = ["chacha", "thread_rng"], workspace = true }
reqwest               = { features = ["json", "query", "rustls"], workspace = true }
serde                 = { workspace = true }
serde_json            = { workspace = true }
sha2                  = { workspace = true }
thiserror             = { workspace = true }
tokio                 = { features = ["fs"], workspace = true }
tokio-stream          = { features = ["net", "sync"], workspace = true }
tonic                 = { features = ["tls-native-roots"], workspace = true }
tower                 = { workspace = true }
tower-http            = { features = ["compression-gzip", "cors", "set-header", "trace"], workspace = true }
tracing               = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber    = { workspace = true }
url                   = { workspace = true }

[dev-dependencies]
fantoccini      = { version = "0.22" }
miden-protocol  = { features = ["testing"], workspace = true }
miden-standards = { workspace = true }
miden-testing   = { default-features = false, version = "=0.17.0-rc.6" }
prost           = { version = "0.14" }
serde_json      = { workspace = true }
tokio           = { features = ["macros", "process"], workspace = true }
tonic-prost     = { version = "0.14" }
tonic-web       = { version = "0.14" }
uuid            = { workspace = true }

# Used to generate the node RPC types for the stub node used in tests
# (so the dependency only lies in the protobuf interface).
[build-dependencies]
brotli                 = { version = "8" }
miden-node-proto-build = { version = "=0.17.0-rc.2" }
tonic-prost-build      = { version = "0.14" }

# Required to avoid false positives in cargo-machete
# This is due to the `winter-maybe-async` crate not working standalone.
[package.metadata.cargo-machete]
ignored = ["async-trait"]
