# Runs the faucet against a real node and funding service.
#
# The setup is split across steps so a failure points at the part that broke: pulling the images,
# starting the network, starting the faucet, or the request itself.

name: test-e2e

on:
  push:
    branches: [main, next]
  pull_request:
    types: [opened, reopened, synchronize]

# Limits workflow concurrency to only the latest commit in the PR.
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  test-e2e:
    name: test-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@main
      - name: Rustup
        run: rustup update --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          # `make test` builds the whole workspace in release, which covers everything this job
          # compiles, so both share one cache instead of each filling its own.
          shared-key: release
          # Saving on a pull request too means a second push to the same branch does not recompile.
          # GitHub scopes a branch's cache to that branch, so this does not disturb other runs.
          save-if: true

      - name: Build the faucet and its client
        run: cargo build --release --locked -p miden-faucet -p miden-faucet-client

      - name: Download the Miden client CLI
        run: make e2e-miden-client

      - name: Start the node and the funding service
        run: make e2e-network-up

      - name: Start the faucet
        run: make e2e-faucet-up

      - name: Request tokens
        run: make e2e-request-tokens

      - name: Faucet logs
        if: failure()
        run: cat target/e2e/faucet.log

      - name: Network logs
        if: failure()
        run: make e2e-network-logs

      - name: Stop everything
        if: always()
        run: make e2e-faucet-down e2e-network-down
